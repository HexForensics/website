; PHP Security Settings for hexforensics.com (CGI/FastCGI mode)
; This file addresses P3 findings from security assessment

; Hide PHP version from HTTP headers
expose_php = Off

; Session security
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1
session.cookie_samesite = Lax

; Error handling (don't expose errors in production)
display_errors = Off
log_errors = On
